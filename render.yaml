services:
  - type: web
    name: whatsapp-automation
    runtime: node
    plan: free               # free: no disk; WhatsApp link is lost on restart/redeploy (re-link when needed)
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD     # login password for the site (8+ chars) - you type it in Render
        sync: false
      - key: DATA_DIR
        value: /tmp/data
      - key: NODE_VERSION
        value: "22"
