services:
  - type: web
    name: whatsapp-automation
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /data
      - key: NODE_VERSION
        value: "22"
