<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#25d366;--g2:#12b886;--gold:#e9c46a;--t:#eaf4ef;--m:#8fa69b;--r:#ff5d5d;--b:rgba(255,255,255,.09)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(900px 600px at 80% -10%,#0d2a1f,transparent 60%),radial-gradient(700px 500px at -10% 110%,#0b1f2a,transparent 55%),#05080a;color:var(--t);font:16px/1.7 'Tajawal',Tahoma,sans-serif}
.card{width:100%;max-width:380px;background:rgba(16,24,22,.62);backdrop-filter:blur(16px);border:1px solid var(--b);border-radius:22px;padding:30px 24px;box-shadow:0 30px 70px rgba(0,0,0,.5);text-align:center;animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.logo{width:60px;height:60px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 12px 30px rgba(37,211,102,.35)}
h1{margin:0 0 4px;font-size:24px;font-weight:800;background:linear-gradient(90deg,#fff,#b9f5d0,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 20px;color:var(--m);font-size:14px}
input{width:100%;padding:13px;border:1px solid var(--b);border-radius:12px;background:rgba(0,0,0,.35);color:var(--t);font:inherit;font-size:18px;text-align:center;letter-spacing:2px}
input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(37,211,102,.15)}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--g2));color:#03140b;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(37,211,102,.25)}
.err{color:var(--r);min-height:1.7em;font-size:14px;margin-top:8px}
</style></head><body>
<form class="card" id="f"><div class="logo">✦</div><h1>منصة الإرسال الذكي</h1><p>اكتب الباسورد عشان تدخل</p>
<input type="password" id="pw" autocomplete="current-password" autofocus required><button>دخول</button><div class="err" id="e"></div></form>
<script>
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='';
const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({password:document.getElementById('pw').value})});
if(r.ok)location.href='/';else e.textContent=(await r.json().catch(()=>({}))).error||'حصل خطأ'};
</script></body></html>
